<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
  </head>
  <body>
    <main class="container">
      <form class="form">
        <label><input type="text" name="search-text" placeholder="Search images..." required /></label>

      </form>
      <div class="loader is-hidden" role="status" aria-label="Loading images"></div>
      <ul class="gallery"></ul>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
